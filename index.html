<style>
/* la tessera del filo ora ha un piede con i suoi comandi */
.thread{display:flex;flex-direction:column;align-items:stretch;text-align:left}
.thread-main{background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer;width:100%}
.thread-piede{display:flex;justify-content:flex-end;gap:8px;padding-top:8px;margin-top:8px;
  border-top:1px solid var(--line)}
.thread.chiuso{opacity:.62}
.thread.chiuso .display{text-decoration:line-through;text-decoration-thickness:1px}

/* gli sviluppi: cosa e' successo a questa persona, luogo o filo */
.sviluppi{border-left:2px solid var(--ember);padding-left:12px}
.sviluppo{margin:10px 0}
.sviluppo .relchip{margin-bottom:5px}
.sviluppo .prose.small{margin:3px 0;color:var(--t2)}

/* la linea del tempo in cima al Mondo */
.tempo{margin:2px 0 16px}
.tempo.vuota{margin:0 0 12px}
.tempo-testa{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.tempo-testa .grouplabel{margin:0}
.tempo-nastro{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.tempo-nastro::-webkit-scrollbar{height:6px}
.tempo-nastro::-webkit-scrollbar-thumb{background:rgba(200,180,150,.25);border-radius:3px}
.tappa{flex:0 0 min(280px,78vw);scroll-snap-align:start;background:rgba(255,245,225,.03);
  border:1px solid var(--line);border-left:2px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tappa.giocata{border-left-color:var(--ember)}
.tappa .quando{display:block;color:var(--t3);font-size:11px;letter-spacing:.06em;margin-bottom:3px}
.tappa .display{display:block;margin-bottom:4px}
.tappa .prose.small{color:var(--t2);margin:0 0 6px}

/* i nomi nuovi pescati dal resoconto */
.nomi-nuovi{border-left:2px solid var(--moss);padding-left:12px}
.nome-nuovo{display:inline-flex;align-items:center;gap:4px;margin:0 8px 8px 0;
  background:rgba(255,245,225,.03);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px}

/* il proiettore: il telo, e i comandi che compaiono solo se muovi il mouse */
body.proietto{overflow:hidden}
body.proietto #gloom,body.proietto #scene,body.proietto #bgimg{display:none !important}
.proiettore{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:24px;overflow:hidden}
.proiettore.con-musica{padding-bottom:170px}
.proiettore>*{flex:0 0 auto;max-width:100%}
.proiettore img{max-width:100%;min-height:0;flex:1 1 auto;object-fit:contain;border-radius:2px;
  box-shadow:0 0 90px rgba(206,136,39,.10)}
.proiettore-nome{font-size:clamp(20px,3.4vw,40px);color:var(--bone);margin:0;text-align:center;letter-spacing:.02em}
.proiettore-nota{color:var(--t3);margin:0;text-align:center;max-width:70ch}
.proiettore-vuoto{text-align:center;color:var(--dim)}
.proiettore-vuoto h1{font-size:clamp(24px,5vw,56px);color:var(--bone);margin:12px 0 4px}
.pyre.grande{color:var(--ember);opacity:.85}
.proiettore-musica{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.6)}
.proiettore-comandi{position:fixed;top:12px;right:12px;display:flex;gap:8px;opacity:0;
  transition:opacity .3s ease;pointer-events:none}
.proiettore-comandi.visibili{opacity:1;pointer-events:auto}
.suonatore iframe{width:100%;height:80px;border:0;border-radius:6px;background:var(--panel)}
.suonatore.grande iframe{height:152px}
.suonatore .fuga{display:inline-block;margin-top:4px;color:var(--t3);font-size:11px}

/* il pannello di proiezione nella regia */
.schermo-ora{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;margin:6px 0 10px;
  background:rgba(255,245,225,.03);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.schermo-ora strong{color:var(--oro2)}
.proiettabili{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px;width:100%;
  max-height:300px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;overscroll-behavior:contain}
.proiettabili::-webkit-scrollbar{width:6px}
.proiettabili::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.proiettabile{background:none;border:1px solid var(--line);border-radius:var(--r);padding:6px;
  color:inherit;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.proiettabile.acceso{border-color:var(--ember);box-shadow:0 0 0 1px rgba(206,136,39,.25)}
.proiettabile .thumb{width:100%;height:64px;object-fit:cover;border-radius:2px}
.proiettabile .mono{font-size:11px;line-height:1.3}
.proiettabile .hint{font-size:10px;color:var(--t3)}

/* il cappello da leggere insieme, in cima alla cronaca */
.ultima-volta{border-left:2px solid var(--ember);background:rgba(206,136,39,.035)}
.ultima-volta .display{font-size:19px;margin:0}
.ultima-volta .eyebrow{color:var(--oro2);margin:2px 0 8px}
.ultima-volta .apertura{font-size:16px;line-height:1.75}
.ultima-volta .sospeso-riga{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.ultima-volta .relchip{margin:4px 6px 0 0;text-align:left}
.apri-ultima{margin-bottom:12px}

/* schede personaggio: campi stretti e numeri leggibili */
.field.terzo{flex:1 1 calc(33.333% - 8px);min-width:96px}
.esperienza{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.esperienza .num{width:64px;text-align:center}
.esperienze .vuoto-mini{margin:2px 0 8px}
.stat b{font-variant-numeric:tabular-nums}

/* la conferma prima di sostituire tutto */
.conferma-ripristino{width:100%;border:1px solid var(--brace,#D96B4F);border-left:3px solid var(--cinder);
  background:rgba(217,107,79,.07);border-radius:var(--r);padding:13px 15px;margin-top:4px}
.conferma-ripristino p{margin:0 0 8px;font-size:15px}
.conferma-ripristino .riga-tit{margin:0 0 8px;color:var(--brace)}

/* le istruzioni del trasloco, dentro lo strumento */
.trasloco{width:100%;border:1px solid var(--line);border-left:3px solid var(--ember);
  background:rgba(206,136,39,.04);border-radius:var(--r);padding:14px 16px}
.trasloco .riga-tit{margin:0 0 8px;color:var(--oro2)}
.trasloco .note{margin:0 0 10px}
ol.passi-trasloco{margin:0 0 10px;padding-left:20px}
ol.passi-trasloco li{margin-bottom:8px;font-size:15px;line-height:1.6}
ol.passi-trasloco li::marker{color:var(--ember);font-family:ui-monospace,monospace}

/* cosa c'è dentro una copia salvata */
.dentro-versione{width:100%;border:1px solid var(--line);border-left:3px solid var(--oro2);
  background:rgba(255,245,225,.03);border-radius:var(--r);padding:10px 12px;margin:6px 0}
.dentro-versione p{margin:0 0 4px;font-size:14px}
.dentro-versione p:last-child{margin-bottom:0}

/* quando l'archivio non risponde: spiegare, non restare muti */
.boot-errore{max-width:34rem;margin:0 auto;padding:24px;text-align:left;font-family:inherit}
.boot-errore h1{font-size:clamp(20px,4vw,28px);color:var(--brace);margin:0 0 12px;font-weight:600}
.boot-errore p{color:var(--bone);font:15px/1.65 ui-serif,Georgia,serif;margin:0 0 10px}
.boot-errore .btn{margin-top:8px}

/* mandare al telo una foto qualsiasi */
.alvolo{width:100%;border:1px solid var(--line);border-left:3px solid var(--ember);
  background:rgba(206,136,39,.04);border-radius:var(--r);padding:13px 15px;margin-bottom:12px}
.alvolo .riga-tit{margin:0 0 6px;color:var(--oro2)}
.alvolo .note{margin:0 0 10px}
.alvolo .row{flex-wrap:wrap;gap:8px;width:100%}
.alvolo label.btn{cursor:pointer}
.proiettabili.corta{max-height:150px;margin-top:6px}

/* il conto dello spazio, voce per voce */
.conto-spazio{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;background:rgba(255,245,225,.02)}
.conto-spazio p{margin:0 0 6px}
.conto-spazio ul{margin:0 0 6px;padding-left:18px;list-style:none}
.conto-spazio li{margin-bottom:3px;color:var(--dim);position:relative}
.conto-spazio li::before{content:"\00B7";position:absolute;left:-12px;color:var(--ember)}
</style>
</body>
</html>
